<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIHOT · 精选阅读器</title>
<style>
  :root{
    --bg:#0b0d10; --bg2:#12151a; --card:#171b21; --card2:#1d2229;
    --line:#252b34; --tx:#e6e9ee; --tx2:#9aa4b2; --tx3:#68727f;
    --ac:#5b8cff; --ac2:#7c5cff; --ok:#3ecf8e; --warn:#f5a524; --bad:#f0616d;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--tx);
    font:15px/1.62 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
  }
  a{color:inherit;text-decoration:none}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(11,13,16,.86); backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--line);
  }
  .hwrap{max-width:820px;margin:0 auto;padding:11px 16px 0}
  .hrow{display:flex;align-items:center;gap:10px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:650;font-size:16.5px;letter-spacing:-.2px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(62,207,142,.14)}
  .dot.loading{background:var(--warn);box-shadow:0 0 0 3px rgba(245,165,36,.14);animation:p 1.1s infinite}
  .dot.err{background:var(--bad);box-shadow:0 0 0 3px rgba(240,97,109,.14)}
  @keyframes p{50%{opacity:.35}}
  .spacer{flex:1}
  .iconbtn{
    width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--tx2);display:grid;place-items:center;
    font-size:15px;cursor:pointer;transition:.15s;
  }
  .iconbtn:active{transform:scale(.93)}
  .iconbtn.on{color:var(--ac);border-color:#2c3f6b;background:#141c2e}
  .meta{font-size:11.5px;color:var(--tx3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px}

  /* ---------- tabs ---------- */
  nav{max-width:820px;margin:0 auto;padding:9px 16px 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;padding:6px 13px;border-radius:999px;font-size:13px;
    background:transparent;border:1px solid var(--line);color:var(--tx2);
    cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .tab:active{transform:scale(.96)}
  .tab.on{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:#fff;font-weight:600}

  /* ---------- search ---------- */
  .search{max-width:820px;margin:0 auto;padding:9px 16px 11px}
  .search input{
    width:100%;padding:9px 13px;border-radius:11px;border:1px solid var(--line);
    background:var(--card);color:var(--tx);font-size:14px;outline:none;transition:.15s;
  }
  .search input:focus{border-color:#2c3f6b;background:var(--card2)}
  .search input::placeholder{color:var(--tx3)}

  /* ---------- list（微信卡片式） ---------- */
  main{max-width:820px;margin:0 auto;padding:2px 12px 40px}
  .card{
    background:var(--card);border-radius:12px;overflow:hidden;
    margin-bottom:8px;transition:.16s;display:block;
    box-shadow:0 1px 2px rgba(0,0,0,.16);
  }
  .card:active{background:var(--card2)}
  /* 左文右图 的微信「大图卡」 */
  .cbody{display:flex;gap:12px;padding:13px 14px;align-items:flex-start}
  .cmain{flex:1;min-width:0}
  .cthumb{
    flex:0 0 78px;width:78px;height:78px;border-radius:8px;overflow:hidden;
    background:linear-gradient(135deg,#1e2735,#252f42);display:grid;place-items:center;
    position:relative;
  }
  .cthumb .fav{
    width:38px;height:38px;border-radius:9px;display:grid;place-items:center;
    font-size:16px;font-weight:700;color:#fff;letter-spacing:-.5px;
  }
  .cthumb .mini{position:absolute;bottom:3px;right:3px;font-size:8px;color:rgba(255,255,255,.5);
    background:rgba(0,0,0,.4);padding:1px 4px;border-radius:3px}

  .ctitle{
    font-size:15px;font-weight:600;line-height:1.42;letter-spacing:-.1px;
    color:var(--tx);margin:0 0 7px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card.open .ctitle{-webkit-line-clamp:unset}
  .csum{
    font-size:12.5px;color:var(--tx3);line-height:1.55;margin-bottom:8px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card.open .csum{-webkit-line-clamp:unset;color:var(--tx2)}

  /* 底部：来源 + 时间（微信风格的小灰字） */
  .cfoot{display:flex;gap:7px;align-items:center;font-size:11.5px;color:var(--tx3)}
  .cavatar{
    width:16px;height:16px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
    font-size:8.5px;font-weight:700;color:#fff;
  }
  .src{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .time{flex:0 0 auto;color:var(--tx3);opacity:.8}

  /* 展开后出现的信息条 */
  .cmeta{display:none;padding:0 14px 11px;gap:8px;flex-wrap:wrap;align-items:center}
  .card.open .cmeta{display:flex}
  .cat{font-size:10.5px;font-weight:600;padding:1.5px 7px;border-radius:4px;letter-spacing:.2px;
    background:#1e2735;color:#8fb0ff}
  .cat.ai-models{background:#2a1f3d;color:#c4a5ff}
  .cat.ai-products{background:#132b2a;color:#5fd6c4}
  .cat.industry{background:#2e2418;color:#f0b968}
  .cat.paper{background:#1a2733;color:#7fb8e8}
  .cat.tip{background:#2b1f28;color:#f094b8}
  .lk{color:var(--ac);font-weight:550;font-size:12px}
  .lk.dim{color:var(--tx3);font-weight:400}
  .score{margin-left:auto;font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
  .reason{
    margin:0 14px 12px;padding:9px 11px;border-radius:8px;font-size:12.5px;line-height:1.6;
    background:#141b29;border-left:2.5px solid var(--ac);color:#a8bcdd;display:none;
  }
  .card.open .reason{display:block}
  .reason b{color:#c5d5f0;font-weight:600}

  /* ---------- states ---------- */
  .center{text-align:center;padding:56px 20px;color:var(--tx3)}
  .center .big{font-size:32px;margin-bottom:10px;opacity:.5}
  .center h3{color:var(--tx2);font-size:15px;font-weight:600;margin:0 0 6px}
  .center p{font-size:13px;margin:0 0 14px;line-height:1.6}
  .btn{
    display:inline-block;padding:9px 18px;border-radius:10px;font-size:13.5px;font-weight:600;
    background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:none;cursor:pointer;
  }
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--tx2);font-weight:500}
  .btn:active{transform:scale(.96)}
  .skel{background:var(--card);border-radius:var(--r);height:112px;margin-bottom:10px;position:relative;overflow:hidden}
  .skel::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.045),transparent);
    animation:sh 1.3s infinite;
  }
  @keyframes sh{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .spinner{
    width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--ac);
    border-radius:50%;animation:sp .75s linear infinite;margin:0 auto 12px;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  .more{display:block;width:100%;margin:6px 0 0;padding:11px;border-radius:11px;
    background:var(--card);border:1px solid var(--line);color:var(--tx2);font-size:13.5px;cursor:pointer}
  .more:active{transform:scale(.985)}

  /* ---------- banner ---------- */
  .banner{
    max-width:820px;margin:0 auto 10px;padding:10px 13px;border-radius:11px;font-size:12.5px;line-height:1.55;
    background:#2a2418;border:1px solid #43361f;color:#e8c98a;display:flex;gap:9px;align-items:flex-start;
  }
  .banner b{color:#f5d99e}
  .x{flex:0 0 auto;cursor:pointer;color:#8a7a5a;font-size:15px;line-height:1}

  /* ---------- footer ---------- */
  footer{max-width:820px;margin:0 auto;padding:0 16px 34px;font-size:11.5px;color:var(--tx3);line-height:1.75}
  footer a{color:var(--tx2);text-decoration:underline;text-underline-offset:2px}
  .srcbar{display:flex;gap:7px;margin-bottom:9px}
  .srcbtn{flex:1;padding:7px;border-radius:9px;background:var(--card);border:1px solid var(--line);
    color:var(--tx3);font-size:11.5px;text-align:center;cursor:pointer}
  .srcbtn.on{border-color:#2c3f6b;color:var(--ac);background:#141c2e;font-weight:600}
  .badge{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px;letter-spacing:.3px;vertical-align:1px}
  .badge.live{background:#132b2a;color:#5fd6c4;border:1px solid #1c403d}
  .badge.snap{background:#2e2418;color:#f0b968;border:1px solid #43361f}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div class="hrow">
      <div class="logo"><span class="dot loading" id="dot"></span>AIHOT 精选阅读器</div>
      <div class="spacer"></div>
      <button class="iconbtn" id="refresh" title="刷新">⟳</button>
      <button class="iconbtn" id="theme" title="切换数据源（API / RSS 快照）">⇄</button>
    </div>
    <div class="meta" id="meta">正在连接…</div>
  </div>
  <nav id="tabs"></nav>
  <div class="search"><input id="q" type="search" placeholder="搜索标题 / 摘要 / 来源…" autocomplete="off"></div>
</header>

<main>
  <div id="banner"></div>
  <div id="list"></div>
</main>

<footer>
  <div class="srcbar" id="srcbar"></div>
  <div id="ftinfo"></div>
  <div style="margin-top:9px">
    数据来自 <a href="https://aihot.news" target="_blank" rel="noopener">AIHOT</a>（数字生命卡兹克开源项目）。
    本站仅作个人非商业阅读用途，标题/摘要/原文链接的著作权归各来源与 AIHOT 所有。
    商业用途须先取得 <a href="https://aihot.news/terms" target="_blank" rel="noopener">AIHOT 书面授权</a>。
  </div>
</footer>

<script src="feeds.js?v=2"></script>
<script src="app.js?v=4"></script>
</body>
</html>
