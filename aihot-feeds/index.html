<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIHOT · 精选阅读器</title>
<style>
  :root{
    /* 微信浅绿主题：背景 #EDEDED / 卡片 #FFF / 主绿 #07C160 */
    --bg:#ededed; --bg2:#f5f5f5; --card:#ffffff; --card2:#f7f7f7;
    --line:#e5e5e5; --tx:#191919; --tx2:#576b95; --tx3:#888888;
    --ac:#07c160; --ac2:#06ad56; --ok:#07c160; --warn:#fa9d3b; --bad:#fa5151;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--tx);
    font:15px/1.62 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
  }
  a{color:inherit;text-decoration:none}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(237,237,237,.92); backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--line);
  }
  .hwrap{max-width:820px;margin:0 auto;padding:11px 16px 0}
  .hrow{display:flex;align-items:center;gap:10px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:650;font-size:16.5px;letter-spacing:-.2px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(7,193,96,.16)}
  .dot.loading{background:var(--warn);box-shadow:0 0 0 3px rgba(250,157,59,.16);animation:p 1.1s infinite}
  .dot.err{background:var(--bad);box-shadow:0 0 0 3px rgba(250,81,81,.16)}
  @keyframes p{50%{opacity:.35}}
  .spacer{flex:1}
  .iconbtn{
    width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--tx3);display:grid;place-items:center;
    font-size:15px;cursor:pointer;transition:.15s;
  }
  .iconbtn:active{transform:scale(.93)}
  .iconbtn.on{color:#fff;border-color:transparent;background:var(--ac)}
  .meta{font-size:11.5px;color:var(--tx3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px}

  /* ---------- tabs ---------- */
  nav{max-width:820px;margin:0 auto;padding:9px 16px 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;padding:6px 13px;border-radius:999px;font-size:13px;
    background:var(--card);border:1px solid var(--line);color:var(--tx3);
    cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .tab:active{transform:scale(.96)}
  .tab.on{background:var(--ac);border-color:transparent;color:#fff;font-weight:600}

  /* ---------- search ---------- */
  .search{max-width:820px;margin:0 auto;padding:9px 16px 11px}
  .search input{
    width:100%;padding:9px 13px;border-radius:11px;border:1px solid var(--line);
    background:var(--card);color:var(--tx);font-size:14px;outline:none;transition:.15s;
  }
  .search input:focus{border-color:var(--ac);background:var(--card)}
  .search input::placeholder{color:var(--tx3)}

  /* ---------- 瀑布流（IG / 视频号 双列） ---------- */
  main{max-width:820px;margin:0 auto;padding:2px 6px 40px}
  /* 用 flex 双列 + JS 分桶（column-count 在 WebKit 下会退化单列） */
  #list{display:flex;gap:7px;align-items:flex-start}
  .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
  @media(min-width:680px){main{max-width:1000px}}
  @media(min-width:680px) and (max-width:900px){}
  .card{
    break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;
    background:var(--card);border-radius:10px;overflow:hidden;
    margin:0 0 7px;display:block;transition:.16s;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
  }
  .card:active{transform:scale(.978)}

  /* 封面：IG 那种接近方形的图 */
  .cover{
    position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;
    display:grid;place-items:center;
  }
  .cover.tall{aspect-ratio:4/5}
  .cover .glyph{
    font-size:34px;font-weight:700;color:rgba(255,255,255,.94);
    letter-spacing:-1px;text-shadow:0 2px 10px rgba(0,0,0,.28);
  }
  /* 封面上的角标：分类 / score */
  .tag{
    position:absolute;top:7px;left:7px;font-size:9.5px;font-weight:700;
    padding:2px 6px;border-radius:5px;letter-spacing:.2px;
    background:rgba(0,0,0,.5);color:#fff;backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
  }
  .hot{
    position:absolute;top:7px;right:7px;font-size:9.5px;font-weight:700;
    padding:2px 6px;border-radius:5px;background:rgba(0,0,0,.5);color:#ffd27a;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }

  /* 图下信息区 */
  .cbody{padding:9px 10px 10px}
  .ctitle{
    font-size:13px;font-weight:600;line-height:1.45;letter-spacing:-.1px;
    color:var(--tx);margin:0 0 7px;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card.open .ctitle{-webkit-line-clamp:unset}
  .csum{
    font-size:11.5px;color:var(--tx3);line-height:1.55;margin:0 0 8px;
    display:none;
  }
  .card.open .csum{
    display:-webkit-box;-webkit-line-clamp:unset;-webkit-box-orient:vertical;overflow:hidden;
    color:var(--tx2);
  }

  /* IG 底部：头像 + 来源 + 时间 */
  .cfoot{display:flex;gap:5px;align-items:center;font-size:10.5px;color:var(--tx3)}
  .cavatar{
    width:15px;height:15px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
    font-size:8px;font-weight:700;color:#fff;
  }
  .src{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .time{flex:0 0 auto;opacity:.75}

  /* 展开后才出现 */
  .cmeta{display:none;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .card.open .cmeta{display:flex}
  .lk{color:var(--ac);font-weight:600;font-size:11.5px}
  .lk.dim{color:var(--tx3);font-weight:400}
  .reason{
    margin-top:8px;padding:8px 9px;border-radius:7px;font-size:11.5px;line-height:1.55;
    background:#f0faf4;border-left:2.5px solid var(--ac);color:#4a6b58;display:none;
  }
  .card.open .reason{display:block}
  .reason b{color:#c5d5f0;font-weight:600}

  /* ---------- states ---------- */
  .center{text-align:center;padding:56px 20px;color:var(--tx3)}
  .center .big{font-size:32px;margin-bottom:10px;opacity:.5}
  .center h3{color:var(--tx2);font-size:15px;font-weight:600;margin:0 0 6px}
  .center p{font-size:13px;margin:0 0 14px;line-height:1.6}
  .btn{
    display:inline-block;padding:9px 18px;border-radius:10px;font-size:13.5px;font-weight:600;
    background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:none;cursor:pointer;
  }
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--tx2);font-weight:500}
  .btn:active{transform:scale(.96)}
  .skel{background:var(--card);border-radius:var(--r);height:112px;margin-bottom:10px;position:relative;overflow:hidden}
  .skel::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.045),transparent);
    animation:sh 1.3s infinite;
  }
  @keyframes sh{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .spinner{
    width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--ac);
    border-radius:50%;animation:sp .75s linear infinite;margin:0 auto 12px;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  .more{display:block;width:100%;margin:6px 0 0;padding:11px;border-radius:11px;
    background:var(--card);border:1px solid var(--line);color:var(--tx2);font-size:13.5px;cursor:pointer}
  .more:active{transform:scale(.985)}

  /* ---------- banner ---------- */
  .banner{
    max-width:820px;margin:0 auto 10px;padding:10px 13px;border-radius:11px;font-size:12.5px;line-height:1.55;
    background:#fff8e6;border:1px solid #f5dfae;color:#8a6a2e;display:flex;gap:9px;align-items:flex-start;
  }
  .banner b{color:#c47f12}
  .x{flex:0 0 auto;cursor:pointer;color:#b8a37a;font-size:15px;line-height:1}

  /* ---------- footer ---------- */
  footer{max-width:820px;margin:0 auto;padding:0 16px 34px;font-size:11.5px;color:var(--tx3);line-height:1.75}
  footer a{color:var(--tx2);text-decoration:underline;text-underline-offset:2px}
  .srcbar{display:flex;gap:7px;margin-bottom:9px}
  .srcbtn{flex:1;padding:7px;border-radius:9px;background:var(--card);border:1px solid var(--line);
    color:var(--tx3);font-size:11.5px;text-align:center;cursor:pointer}
  .srcbtn.on{border-color:var(--ac);color:var(--ac);background:#eaf9f0;font-weight:600}
  .badge{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px;letter-spacing:.3px;vertical-align:1px}
  .badge.live{background:#eaf9f0;color:#07c160;border:1px solid #b8e8cc}
  .badge.snap{background:#fff4e5;color:#e08a1e;border:1px solid #f5d9ae}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div class="hrow">
      <div class="logo"><span class="dot loading" id="dot"></span>AIHOT 精选阅读器</div>
      <div class="spacer"></div>
      <button class="iconbtn" id="refresh" title="刷新">⟳</button>
      <button class="iconbtn" id="theme" title="切换数据源（API / RSS 快照）">⇄</button>
    </div>
    <div class="meta" id="meta">正在连接…</div>
  </div>
  <nav id="tabs"></nav>
  <div class="search"><input id="q" type="search" placeholder="搜索标题 / 摘要 / 来源…" autocomplete="off"></div>
</header>

<main>
  <div id="banner"></div>
  <div id="list"></div>
</main>

<footer>
  <div class="srcbar" id="srcbar"></div>
  <div id="ftinfo"></div>
  <div style="margin-top:9px">
    数据来自 <a href="https://aihot.news" target="_blank" rel="noopener">AIHOT</a>（数字生命卡兹克开源项目）。

    商业用途须先取得 <a href="https://aihot.news/terms" target="_blank" rel="noopener">AIHOT 书面授权</a>。
  </div>
</footer>

<script src="feeds.js?v=2"></script>
<script src="app.js?v=7"></script>
</body>
</html>
